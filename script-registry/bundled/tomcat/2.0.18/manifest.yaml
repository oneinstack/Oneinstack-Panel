        - {softwareVersion: 7.0.109, architecture: arm64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-7/v7.0.109/bin/apache-tomcat-7.0.109.tar.gz, sha256: ebfeb051e6da24bce583a4105439bfdafefdc7c5bdd642db2ab07e056211cb31}
        - {softwareVersion: 8.5.96, architecture: amd64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.96/bin/apache-tomcat-8.5.96.tar.gz, sha256: 0307cfb85e58a2ff3d033d464bdc01f03fd5452618b17baf64368b1e6b02e886}
        - {softwareVersion: 8.5.96, architecture: arm64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.96/bin/apache-tomcat-8.5.96.tar.gz, sha256: 0307cfb85e58a2ff3d033d464bdc01f03fd5452618b17baf64368b1e6b02e886}
        - {softwareVersion: 9.0.113, architecture: amd64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.113/bin/apache-tomcat-9.0.113.tar.gz, sha256: 790db2b8092b7954dec2afc6af71a7bbb6c67998198516dd6a9f865661b5d2a7}
        - {softwareVersion: 9.0.113, architecture: arm64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.113/bin/apache-tomcat-9.0.113.tar.gz, sha256: 790db2b8092b7954dec2afc6af71a7bbb6c67998198516dd6a9f865661b5d2a7}
        - {softwareVersion: 10.1.50, architecture: amd64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.50/bin/apache-tomcat-10.1.50.tar.gz, sha256: f74f9f1a7ac2cf6eeede2c50f45088d9c3e55f77d5777f9f7033ed3d43ef529c}
        - {softwareVersion: 10.1.50, architecture: arm64, runtime: tomcat, url: https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.50/bin/apache-tomcat-10.1.50.tar.gz, sha256: f74f9f1a7ac2cf6eeede2c50f45088d9c3e55f77d5777f9f7033ed3d43ef529c}
