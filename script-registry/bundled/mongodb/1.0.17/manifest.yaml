dependencies:
  packages:
    apt: [acl, ca-certificates, curl, gnupg, gzip, iproute2, libcurl4, libgssapi-krb5-2, libldap-2.4-2, libldap-2.5-0, libldap2, liblzma5, libsasl2-2, libsasl2-modules, libsasl2-modules-gssapi-mit, libwrap0, openssl, tar]
    dnf: [acl, ca-certificates, cyrus-sasl, cyrus-sasl-gssapi, cyrus-sasl-plain, curl, gnupg2, gzip, krb5-libs, libcurl, libpcap, openldap, openssl-libs, tar, xz-libs]
    yum: [acl, ca-certificates, cyrus-sasl, cyrus-sasl-gssapi, cyrus-sasl-plain, curl, gnupg2, gzip, krb5-libs, libcurl, libpcap, openldap, openssl-libs, tar, xz-libs]
    zypper: [acl, ca-certificates, cyrus-sasl, curl, gpg2, gzip, krb5, libcurl4, libldap-2_4-2, libopenssl3, libpcap1, libwrap0, libzio1, tar, xz]
serviceName: mongod
actions:
  precheck: scripts/precheck.sh
  install: scripts/install.sh
  configure: scripts/configure.sh
  verify: scripts/verify.sh
  upgrade: scripts/install.sh
  rollback: scripts/rollback.sh
  uninstall: scripts/uninstall.sh
  status: scripts/status.sh
  start: scripts/start.sh
  stop: scripts/stop.sh
  restart: scripts/restart.sh
  configGet: scripts/config.sh
  configApply: scripts/config.sh
parameters:
  - {name: software-version, env: SOFTWARE_VERSION, type: string, required: true, default: "8.0.32", description: "MongoDB 精确版本，只允许 8.0.17 或 8.0.32。"}
  - {name: mongodb-port, env: MONGODB_PORT, type: port, default: "27017", description: "MongoDB TCP 监听端口。"}
  - {name: mongodb-bind-ip, env: MONGODB_BIND_IP, type: string, default: "127.0.0.1", description: "逗号分隔的 IP 或主机名；非回环绑定仍强制启用认证。"}
  - {name: install-dir, env: INSTALL_DIR, type: path, default: /usr/local/mongodb, description: "受管安装目录，安装后不可在线迁移。"}
  - {name: data-dir, env: DATA_DIR, type: path, default: /data/mongodb, description: "MongoDB 数据目录；拒绝接管非空外部目录。"}
  - {name: log-dir, env: LOG_DIR, type: path, default: /data/mongodb, description: "MongoDB 日志目录。"}
  - {name: run-user, env: RUN_USER, type: string, default: mongod}
  - {name: run-group, env: RUN_GROUP, type: string, default: mongod}
  - {name: mongodb-admin-username, env: MONGODB_ADMIN_USERNAME, type: string, default: root, description: "MongoDB admin 数据库管理员用户名。"}
  - {name: mongodb-admin-password, env: MONGODB_ADMIN_PASSWORD, type: password, required: true, secret: true, description: "首次初始化必填，12-128 字符；只通过安全输入传递且不持久化。"}
  - {name: ONEINSTACK_INSTALL_MODE, type: string, default: center, description: "Panel 后端注入的安装模式。"}
  - {name: ONEINSTACK_OFFLINE_PACKAGE_PATH, type: path, description: "Panel 后端注入的完全离线 Bundle 根目录。"}
  - {name: ONEINSTACK_COMPONENT_STATE, type: path, default: /var/lib/oneinstack/components, description: "Panel 后端注入的组件状态目录。"}
  - {name: data-policy, env: UNINSTALL_DATA_POLICY, type: string, default: preserve, description: "卸载数据策略；默认保留。"}
  - {name: delete-data-confirm, env: UNINSTALL_CONFIRM_DATA_DELETION, type: boolean, default: "false", description: "data-policy=delete 时必须同时明确确认。"}
configuration:
  applyMode: restart
  fields:
    - {key: mongodbPort, label: 监听端口, type: port, env: ONEINSTACK_CONFIG_MONGODB_PORT, default: "27017", min: 1, max: 65535}
    - {key: bindIp, label: 绑定地址, type: string, env: ONEINSTACK_CONFIG_BIND_IP, default: "127.0.0.1", description: "逗号分隔的 IP 或主机名，禁止换行及 YAML 注入。"}
    - {key: maxIncomingConnections, label: 最大入站连接数, type: integer, env: ONEINSTACK_CONFIG_MAX_INCOMING_CONNECTIONS, default: "0", min: 0, max: 1000000, description: "0 表示使用 MongoDB 自动值；非零值最小为 100。"}
    - {key: wiredTigerCacheSizeGB, label: WiredTiger 缓存, type: integer, env: ONEINSTACK_CONFIG_WIREDTIGER_CACHE_SIZE_GB, unit: GB, default: "0", min: 0, max: 1024, description: "0 表示自动；非零值最小为 1 GB。"}
    - {key: operationProfilingMode, label: 性能分析模式, type: select, env: ONEINSTACK_CONFIG_OPERATION_PROFILING_MODE, default: off, options: [off, slowOp, all]}
    - {key: slowOpThresholdMs, label: 慢操作阈值, type: integer, env: ONEINSTACK_CONFIG_SLOW_OP_THRESHOLD_MS, unit: 毫秒, default: "100", min: 1, max: 600000}
timeouts:
  precheck: 180
  install: 1800
  configure: 600
  verify: 180
  upgrade: 1800
  rollback: 600
  uninstall: 300
  status: 30
  start: 180
  stop: 180
  restart: 300
  configGet: 30
  configApply: 600
