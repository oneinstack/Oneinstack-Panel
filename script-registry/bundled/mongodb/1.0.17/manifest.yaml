  name: MongoDB
  version: 1.0.17
  softwareVersions: ["8.0.17", "8.0.32"]
  channel: stable
  allowCustomVersion: false
  description: Managed MongoDB 8.0.17/8.0.32 lifecycle with exact official archives, authenticated bootstrap, transactional configuration, upgrade rollback, and complete offline bundles.
