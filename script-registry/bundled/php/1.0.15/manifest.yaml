serviceName: php-fpm
runtimeGroup: php-runtime
actions:
  precheck: scripts/precheck.sh
  install: scripts/install.sh
  configure: scripts/configure.sh
  verify: scripts/verify.sh
  upgrade: scripts/install.sh
  rollback: scripts/rollback.sh
  uninstall: scripts/uninstall.sh
  status: scripts/status.sh
  start: scripts/start.sh
  stop: scripts/stop.sh
  restart: scripts/restart.sh
  reload: scripts/reload.sh
  configGet: scripts/config.sh
  configApply: scripts/config.sh
parameters:
  - {name: software-version, env: SOFTWARE_VERSION, type: string, required: true, description: "Exact PHP release published by Center; legacy and modern releases use separate build profiles and host matrices."}
  - {name: install-dir, env: INSTALL_DIR, type: path, default: /usr/local/php, description: "Managed PHP installation directory."}
  - {name: log-dir, env: LOG_DIR, type: path, default: /var/log/php-fpm, description: "Managed PHP-FPM log directory."}
  - {name: socket-path, env: SOCKET_PATH, type: path, default: /dev/shm/php-cgi.sock, description: "PHP-FPM Unix socket path."}
  - {name: run-user, env: RUN_USER, type: string, default: www, description: "PHP-FPM worker account."}
  - {name: run-group, env: RUN_GROUP, type: string, default: www, description: "PHP-FPM worker group."}
  - {name: component-state-dir, env: ONEINSTACK_COMPONENT_STATE, type: path, default: /var/lib/oneinstack/components, description: "Oneinstack component state directory."}
  - {name: php-memory-limit, env: PHP_MEMORY_LIMIT, type: string, default: 256M, description: "Legacy install-time memory limit compatibility parameter."}
  - {name: migrate-external-php, env: MIGRATE_EXTERNAL_PHP, type: boolean, default: false, description: "Allow migration of a detected external PHP-FPM installation."}
  - {name: migrate-external-confirm, env: MIGRATE_EXTERNAL_CONFIRM, type: boolean, default: false, description: "Explicit confirmation for external PHP-FPM migration."}
  - {name: data-policy, env: DATA_POLICY, type: string, default: preserve, description: "Uninstall data policy; preserve is the default."}
  - {name: delete-data-confirm, env: DELETE_DATA_CONFIRM, type: boolean, default: false, description: "Explicit confirmation for component-owned data deletion."}
timeouts: {precheck: 120, install: 7200, configure: 120, verify: 120, upgrade: 7200, rollback: 300, uninstall: 300, status: 10, start: 120, stop: 120, restart: 180, reload: 120, configGet: 10, configApply: 180}
configuration:
  applyMode: reload
  fields:
    - {key: memoryLimit, label: "脚本内存上限", type: integer, env: ONEINSTACK_CONFIG_MEMORY_LIMIT, default: "256", unit: MB, min: 32, max: 8192}
    - {key: uploadMaxFilesize, label: "单文件上传上限", type: integer, env: ONEINSTACK_CONFIG_UPLOAD_MAX_FILESIZE, default: "2", unit: MB, min: 1, max: 2048}
    - {key: postMaxSize, label: "POST 数据上限", type: integer, env: ONEINSTACK_CONFIG_POST_MAX_SIZE, default: "8", unit: MB, min: 1, max: 4096}
    - {key: maxExecutionTime, label: "脚本执行超时", type: integer, env: ONEINSTACK_CONFIG_MAX_EXECUTION_TIME, default: "30", unit: 秒, min: 10, max: 3600}
    - {key: pmMaxChildren, label: "最大子进程数", type: integer, env: ONEINSTACK_CONFIG_PM_MAX_CHILDREN, default: "32", min: 1, max: 10000}
    - {key: pmStartServers, label: "启动进程数", type: integer, env: ONEINSTACK_CONFIG_PM_START_SERVERS, default: "4", min: 1, max: 10000}
    - {key: pmMinSpareServers, label: "最小空闲进程", type: integer, env: ONEINSTACK_CONFIG_PM_MIN_SPARE_SERVERS, default: "2", min: 1, max: 10000}
    - {key: pmMaxSpareServers, label: "最大空闲进程", type: integer, env: ONEINSTACK_CONFIG_PM_MAX_SPARE_SERVERS, default: "8", min: 1, max: 10000}
