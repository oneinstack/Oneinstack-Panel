    verify: scripts/verify.sh
    rollback: scripts/rollback.sh
    uninstall: scripts/uninstall.sh
parameters:
    - name: SOFTWARE_VERSION
      type: string
      required: true
      default: 22.12.0
      description: Exact Node.js runtime version selected by Panel.
    - name: INSTALL_DIR
      type: path
      default: /usr/local/node
      description: Managed Node.js installation directory.
    - name: TAKEOVER_UNMANAGED_CONFLICTS
      type: boolean
      default: "false"
      description: Back up and replace an unmanaged Node.js installation directory, global entrypoints, or profile configuration.
    - name: ONEINSTACK_COMPONENT_STATE
      type: path
      default: /var/lib/oneinstack/components
      description: Internal component state directory.
    - name: ONEINSTACK_INSTALL_MODE
      type: string
      default: center
      description: Internal Center or offline execution mode.
    - name: ONEINSTACK_OFFLINE_PACKAGE_PATH
      type: path
      description: Internal validated offline package root.
