schemaVersion: 1
component:
  id: nginx
  name: Nginx
  version: 1.0.11
  softwareVersions: ["1.x"]
  channel: stable
  description: OneinStack-style source installation of Nginx with verified upstream downloads and systemd.
compatibility:
  systems:
    - id: ubuntu
      versions: ["22.04", "24.04", "26.04"]
    - id: debian
      versions: ["11", "12", "13"]
    - id: rhel
      versions: ["8", "9", "10"]
    - id: rocky
      versions: ["8", "9", "10"]
    - id: almalinux
      versions: ["8", "9", "10"]
    - id: centos
      versions: ["7", "8", "9", "10"]
    - id: ol
      versions: ["8", "9", "10"]
    - id: fedora
      versions: ["*"]
    - id: sles
      versions: ["*"]
    - id: opensuse-leap
      versions: ["*"]
    - id: opensuse-tumbleweed
      versions: ["*"]
    - id: opensuse
      versions: ["*"]
    - id: amzn
      versions: ["2023"]
  architectures: [amd64, arm64]
sources:
  releases:
    - {softwareVersion: 1.28.2, architecture: amd64, buildId: nginx-1.28.2-amd64-oneinstack-1.0.11, url: https://nginx.org/download/nginx-1.28.2.tar.gz, signatureUrl: https://nginx.org/download/nginx-1.28.2.tar.gz.asc, sha256: 20e5e0f2c917acfb51120eec2fba9a4ba4e1e10fd28465067cc87a7d81a829a3, publisherFingerprint: 43387825DDB1BB97EC36BA5D007C8D7C15D87369}
    - {softwareVersion: 1.28.2, architecture: arm64, buildId: nginx-1.28.2-arm64-oneinstack-1.0.11, url: https://nginx.org/download/nginx-1.28.2.tar.gz, signatureUrl: https://nginx.org/download/nginx-1.28.2.tar.gz.asc, sha256: 20e5e0f2c917acfb51120eec2fba9a4ba4e1e10fd28465067cc87a7d81a829a3, publisherFingerprint: 43387825DDB1BB97EC36BA5D007C8D7C15D87369}
    - {softwareVersion: 1.31.0, architecture: amd64, buildId: nginx-1.31.0-amd64-oneinstack-1.0.11, url: https://nginx.org/download/nginx-1.31.0.tar.gz, signatureUrl: https://nginx.org/download/nginx-1.31.0.tar.gz.asc, sha256: 6d5b00d45393af2e4e7c52a442d2a198f0ccbc7678ed062a46f403edd833ebaa, publisherFingerprint: 43387825DDB1BB97EC36BA5D007C8D7C15D87369}
    - {softwareVersion: 1.31.0, architecture: arm64, buildId: nginx-1.31.0-arm64-oneinstack-1.0.11, url: https://nginx.org/download/nginx-1.31.0.tar.gz, signatureUrl: https://nginx.org/download/nginx-1.31.0.tar.gz.asc, sha256: 6d5b00d45393af2e4e7c52a442d2a198f0ccbc7678ed062a46f403edd833ebaa, publisherFingerprint: 43387825DDB1BB97EC36BA5D007C8D7C15D87369}
dependencies:
  packages:
    apt: [acl, build-essential, ca-certificates, curl, gnupg, iproute2, libpcre2-dev, libssl-dev, tar, zlib1g-dev]
    dnf: [acl, gcc, gcc-c++, make, ca-certificates, curl, gnupg2, iproute, pcre2-devel, openssl-devel, tar, gzip, zlib-devel]
    yum: [acl, gcc, gcc-c++, make, ca-certificates, curl, gnupg2, iproute, pcre2-devel, openssl-devel, tar, gzip, zlib-devel]
    zypper: [acl, gcc, gcc-c++, make, ca-certificates, curl, gpg2, iproute2, pcre2-devel, libopenssl-devel, tar, gzip, zlib-devel]
runtimeGroup: web-server
serviceName: oneinstack-nginx
actions:
  precheck: scripts/precheck.sh
  install: scripts/install.sh
  configure: scripts/configure.sh
  verify: scripts/verify.sh
  upgrade: scripts/install.sh
  rollback: scripts/rollback.sh
  uninstall: scripts/uninstall.sh
  status: scripts/status.sh
  start: scripts/start.sh
  stop: scripts/stop.sh
  restart: scripts/restart.sh
  reload: scripts/reload.sh
  configGet: scripts/config.sh
  configApply: scripts/config.sh
parameters:
  - {name: SOFTWARE_VERSION, type: string, required: true, default: "1.31.0", description: Nginx exact version published by Center.}
  - {name: NGINX_PORT, type: port, default: "80", description: Nginx HTTP listener port.}
  - {name: PHP_FPM_SOCKET, type: path, default: /dev/shm/php-cgi.sock, description: PHP-FPM Unix socket used by the default PHP location.}
  - {name: INSTALL_DIR, type: path, default: /usr/local/nginx}
  - {name: WEB_ROOT, type: path, default: /data/wwwroot}
  - {name: LOG_DIR, type: path, default: /data/wwwlogs}
  - {name: RUN_USER, type: string, default: www}
  - {name: RUN_GROUP, type: string, default: www}
  - {name: UNINSTALL_DATA_POLICY, type: string, default: preserve, description: Preserve or delete the component-owned installation state on uninstall.}
  - {name: UNINSTALL_CONFIRM_DATA_DELETION, type: boolean, default: "false", description: Required confirmation when deleting component-owned state.}
  - {name: ONEINSTACK_COMPONENT_STATE, type: path, default: /var/lib/oneinstack/components}
configuration:
  applyMode: reload
  fields:
    - {key: workerProcesses, label: 工作进程数, type: worker_processes, env: ONEINSTACK_CONFIG_WORKER_PROCESSES, description: 建议保持 auto；手动设置范围为 1–99。}
    - {key: workerConnections, label: 单进程连接数, type: integer, env: ONEINSTACK_CONFIG_WORKER_CONNECTIONS, min: 512, max: 65535, description: 每个工作进程允许的最大连接数。}
    - {key: keepaliveTimeout, label: 长连接超时, type: integer, env: ONEINSTACK_CONFIG_KEEPALIVE_TIMEOUT, min: 5, max: 300, unit: 秒, description: 客户端 Keep-Alive 空闲超时。}
    - {key: clientMaxBodySize, label: 请求体上限, type: integer, env: ONEINSTACK_CONFIG_CLIENT_MAX_BODY_SIZE, min: 1, max: 10240, unit: MB, description: 上传请求允许的最大请求体。}
    - {key: nginxPort, label: 监听端口, type: port, env: ONEINSTACK_CONFIG_NGINX_PORT, min: 1, max: 65535, description: Nginx 默认站点监听的 HTTP 端口。}
    - {key: installDir, label: 安装目录, type: path, env: ONEINSTACK_CONFIG_INSTALL_DIR, description: Nginx 已安装文件所在目录；如需更换请重新安装。}
    - {key: webRoot, label: 网站根目录, type: path, env: ONEINSTACK_CONFIG_WEB_ROOT, description: 默认站点的网站根目录。}
    - {key: logDir, label: 日志目录, type: path, env: ONEINSTACK_CONFIG_LOG_DIR, description: Nginx 访问日志和错误日志目录。}
    - {key: runUser, label: 运行账号, type: string, env: ONEINSTACK_CONFIG_RUN_USER, description: Nginx worker 进程运行账号。}
    - {key: runGroup, label: 运行用户组, type: string, env: ONEINSTACK_CONFIG_RUN_GROUP, description: Nginx worker 进程运行用户组。}
timeouts: {precheck: 120, install: 3600, configure: 120, verify: 120, upgrade: 3600, rollback: 300, uninstall: 300, status: 10, start: 120, stop: 120, restart: 180, reload: 120, configGet: 10, configApply: 180}
