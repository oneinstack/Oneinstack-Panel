schemaVersion: 1
component:
    id: apache
    name: Apache HTTP Server
    version: 1.0.17
    softwareVersions:
        - 2.4.66
    channel: stable
    description: Official OneinStack Apache source installer using event MPM and PHP-FPM mode. Pinned to OneinStack commit 42d59b33765ad57c455b83bc3d4eb09ed367754a.
compatibility:
    panel: '>=0.1.0-0'
    systems:
        - id: ubuntu
          versions:
            - "20.04"
            - "22.04"
            - "24.04"
        - id: debian
          versions:
            - "11"
            - "12"
        - id: rocky
          versions:
            - "8"
            - "9"
        - id: almalinux
          versions:
            - "8"
            - "9"
    architectures:
        - amd64
dependencies:
    packages:
        apt:
            - ca-certificates
            - curl
            - gzip
            - tar
            - xz-utils
conflicts:
    - nginx
    - tengine
    - openresty
    - caddy
runtimeGroup: web-server
serviceName: oneinstack-httpd
actions:
    precheck: scripts/precheck.sh
    install: scripts/install.sh
    verify: scripts/verify.sh
    rollback: scripts/rollback.sh
    uninstall: scripts/uninstall.sh
    status: scripts/status.sh
    start: scripts/start.sh
    stop: scripts/stop.sh
    restart: scripts/restart.sh
parameters:
    - name: SOFTWARE_VERSION
      type: string
      required: true
      description: Exact OneinStack software version line selected by Panel.
    - name: ONEINSTACK_COMPONENT_STATE
      type: path
      default: /var/lib/oneinstack/components
timeouts:
    precheck: 180
    install: 14400
    verify: 300
    rollback: 900
    uninstall: 900
    status: 30
    start: 180
    stop: 180
    restart: 300
