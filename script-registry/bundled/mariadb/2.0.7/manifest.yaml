conflicts: [mysql, percona]
runtimeGroup: database
serviceName: mariadb
actions:
  precheck: scripts/precheck.sh
  install: scripts/install.sh
  configure: scripts/configure.sh
  verify: scripts/verify.sh
  upgrade: scripts/install.sh
  rollback: scripts/rollback.sh
  uninstall: scripts/uninstall.sh
  status: scripts/status.sh
  start: scripts/start.sh
  stop: scripts/stop.sh
  restart: scripts/restart.sh
  configGet: scripts/config.sh
  configApply: scripts/config.sh
parameters:
  - name: software-version
    env: SOFTWARE_VERSION
    type: string
    required: true
    default: "11.4.13"
    description: Exact MariaDB LTS version; CentOS 7 x86_64 supports only 10.11.19, while other compatible hosts support 10.11.19 and 11.4.13.
  - name: mariadb-port
    env: MARIADB_PORT
    type: port
    default: "3306"
    description: MariaDB TCP listener port.
  - name: mariadb-bind-address
    env: MARIADB_BIND_ADDRESS
    type: string
    default: "127.0.0.1"
    description: MariaDB listener address; loopback-only by default.
  - name: install-dir
    env: INSTALL_DIR
    type: path
    default: /usr/local/mariadb
  - name: data-dir
    env: DATA_DIR
    type: path
    default: /data/mariadb
    description: Existing data is accepted only with Oneinstack ownership state or a verified preserved-data uninstall record.
  - name: log-dir
    env: LOG_DIR
    type: path
    default: /data/mariadb
  - name: run-user
    env: RUN_USER
    type: string
    default: mysql
  - name: run-group
    env: RUN_GROUP
    type: string
    default: mysql
  - name: mysql-username
    env: MYSQL_USERNAME
    type: string
    default: root
    description: MariaDB administrative SQL login; the MySQL-compatible key preserves the Panel database contract.
  - name: mysql-password
    env: MYSQL_PASSWORD
    type: password
    secret: true
    description: Required for new data and preserved-data recovery; when omitted Panel generates and delivers a 24-character password.
  - name: component-state-dir
    env: COMPONENT_STATE_DIR
    type: path
    default: /var/lib/oneinstack/components
  - name: data-policy
    env: DATA_POLICY
    type: string
    default: preserve
    description: Uninstall data policy; managed data is preserved by default.
  - name: delete-data-confirm
    env: DELETE_DATA_CONFIRM
    type: boolean
    default: "false"
    description: Must be true together with data-policy=delete.
configuration:
  applyMode: restart
  fields:
    - key: maxConnections
      label: 最大连接数
      type: integer
      env: ONEINSTACK_CONFIG_MAX_CONNECTIONS
      default: "300"
      min: 10
      max: 100000
    - key: maxAllowedPacket
      label: 数据包上限
      type: integer
      env: ONEINSTACK_CONFIG_MAX_ALLOWED_PACKET
      unit: MB
      default: "64"
      min: 1
      max: 1024
    - key: innodbBufferPoolSize
      label: InnoDB 缓冲池
      type: integer
      env: ONEINSTACK_CONFIG_INNODB_BUFFER_POOL_SIZE
      unit: MB
      default: "128"
      min: 128
      max: 1048576
    - key: slowQueryLog
      label: 慢查询日志
      type: boolean
      env: ONEINSTACK_CONFIG_SLOW_QUERY_LOG
      default: "false"
    - key: longQueryTime
      label: 慢查询阈值
      type: integer
      env: ONEINSTACK_CONFIG_LONG_QUERY_TIME
      unit: 秒
      default: "10"
      min: 1
      max: 600
    - key: mariadbPort
      label: 监听端口
      type: port
      env: ONEINSTACK_CONFIG_MARIADB_PORT
      min: 1
      max: 65535
      description: MariaDB TCP listener port; changing it restarts the service.
    - key: bindAddress
      label: 绑定地址
      type: string
      env: ONEINSTACK_CONFIG_BIND_ADDRESS
      description: MariaDB TCP listener address.
timeouts:
  precheck: 300
  install: 14400
  configure: 1200
  verify: 300
  upgrade: 14400
  rollback: 900
  uninstall: 600
  status: 30
  start: 300
  stop: 300
  restart: 600
  configGet: 30
  configApply: 600
