name: Auto Release from Main

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: oneinstack-panel-auto-release
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    name: Create release tag and dispatch Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve automatic release tag
        id: release
        shell: bash
        env:
          CENTER_RELEASE_URL: ${{ secrets.CENTER_RELEASE_URL }}
          CENTER_RELEASE_TOKEN: ${{ secrets.CENTER_RELEASE_TOKEN }}
        run: |
          readonly start_major=1
          readonly start_minor=1
          readonly start_patch=75
          readonly start_value=$((start_major * 10000 + start_minor * 100 + start_patch))

          parse_release_tag() {
            local tag="$1"
            if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
              parsed_major=$((10#${BASH_REMATCH[1]}))
              parsed_minor=$((10#${BASH_REMATCH[2]}))
              parsed_patch=$((10#${BASH_REMATCH[3]}))
              parsed_value=$((parsed_major * 10000 + parsed_minor * 100 + parsed_patch))
              return 0
            fi
            return 1
          }

          git fetch --force --tags origin

          matching_tags=()
          while IFS= read -r tag; do
            if parse_release_tag "${tag}" && (( parsed_value >= start_value )); then
              tag_commit="$(git rev-list --max-count=1 "${tag}")"
              if [[ "${tag_commit}" == "${GITHUB_SHA}" ]]; then
                matching_tags+=("${tag}")
              fi
            fi
          done < <(git tag --points-at "${GITHUB_SHA}")

          if (( ${#matching_tags[@]} > 1 )); then
            echo "Multiple automatic release tags already point to ${GITHUB_SHA}: ${matching_tags[*]}" >&2
            exit 1
          fi

          if (( ${#matching_tags[@]} == 1 )); then
            release_tag="${matching_tags[0]}"
            echo "Reusing automatic release tag ${release_tag} for ${GITHUB_SHA}."
          else
            latest_value=-1
            latest_major=0
            latest_minor=0
            latest_patch=0

            while IFS= read -r tag; do
              if parse_release_tag "${tag}" && (( parsed_value >= start_value && parsed_value > latest_value )); then
                latest_value="${parsed_value}"
                latest_major="${parsed_major}"
                latest_minor="${parsed_minor}"
                latest_patch="${parsed_patch}"
              fi
            done < <(git tag --list)

            if [[ -z "${CENTER_RELEASE_URL}" || -z "${CENTER_RELEASE_TOKEN}" ]]; then
              echo "::warning::Center release URL or token is not configured; using Git tags."
            elif [[ "${CENTER_RELEASE_URL}" != https://* ]]; then
              echo "::warning::Center release URL must use HTTPS; using Git tags."
            else
              center_temp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/panel-center-version.XXXXXX")"
              center_curl_config="${center_temp_dir}/curl.conf"
              center_response_file="${center_temp_dir}/releases.json"
              trap 'rm -f -- "${center_curl_config}" "${center_response_file}"; rmdir -- "${center_temp_dir}"' EXIT
              chmod 0700 "${center_temp_dir}"
              printf 'silent\nfail\nconnect-timeout = 5\nmax-time = 15\nheader = "Authorization: Bearer %s"\n' \
                "${CENTER_RELEASE_TOKEN}" > "${center_curl_config}"
              chmod 0600 "${center_curl_config}"

              if center_http_code="$(curl --config "${center_curl_config}" \
                --output "${center_response_file}" --write-out '%{http_code}' \
                "${CENTER_RELEASE_URL%/}/v1/admin/panel/releases")"; then
                if jq -e '(.releases | type == "array") and all(.releases[]; type == "object" and (.version | type == "string"))' \
                  "${center_response_file}" >/dev/null 2>&1; then
                  git_latest_value="${latest_value}"
                  while IFS= read -r version; do
                    if parse_release_tag "${version}" && (( parsed_value >= start_value && parsed_value > latest_value )); then
                      latest_value="${parsed_value}"
                      latest_major="${parsed_major}"
                      latest_minor="${parsed_minor}"
                      latest_patch="${parsed_patch}"
                    fi
                  done < <(jq -r '.releases[].version' "${center_response_file}")
                  if (( latest_value > git_latest_value )); then
                    echo "Center release v${latest_major}.${latest_minor}.${latest_patch} is the next-version base."
                  else
                    echo "Center has no higher stable release; using Git tag base."
                  fi
                else
                  echo "::warning::Center release response is invalid; using Git tags."
                fi
              else
                center_curl_status=$?
                echo "::warning::Center query failed (curl exit ${center_curl_status}, HTTP ${center_http_code:-unknown}); using Git tags."
              fi
            fi

            if (( latest_value < start_value )); then
              release_tag="v${start_major}.${start_minor}.${start_patch}"
            else
              next_major="${latest_major}"
              next_minor="${latest_minor}"
              next_patch=$((latest_patch + 1))

              if (( next_patch > 99 )); then
                next_patch=0
                next_minor=$((next_minor + 1))
              fi
              if (( next_minor > 99 )); then
                next_minor=0
                next_major=$((next_major + 1))
              fi

              release_tag="v${next_major}.${next_minor}.${next_patch}"
            fi
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create immutable tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_commit="$(git rev-list --max-count=1 "${RELEASE_TAG}")"
            if [[ "${existing_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists for this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" "${GITHUB_SHA}" \
            --message "Automated Panel release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Dispatch release workflow for tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_TAG}"
