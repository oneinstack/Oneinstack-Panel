name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run quality gate
        run: make quality

  web-assets:
    name: Resolve verified Web Publish assets
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.web.outputs.source_sha }}
    steps:
      - name: Check out Panel source
        uses: actions/checkout@v6

      - name: Check out Web Publish branch
        uses: actions/checkout@v6
        with:
          repository: oneinstack/Oneinstack-Panel-Web
          ref: Publish
          path: web-publish
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Web Publish provenance and archive
        id: web
        shell: bash
        run: |
          source_sha="$(
            ./scripts/import-web-publish.sh \
              web-publish \
              "${RUNNER_TEMP}/verified-web/app.zip"
          )"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          cp web-publish/app.zip.sha256 "${RUNNER_TEMP}/verified-web/"
          cp web-publish/build-info.json "${RUNNER_TEMP}/verified-web/"
          cp web-publish/SOURCE_SHA "${RUNNER_TEMP}/verified-web/"

      - name: Upload verified Web assets
        uses: actions/upload-artifact@v7
        with:
          name: one-web-publish-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/verified-web/

  package:
    name: Package Linux ${{ matrix.arch }}
    needs: [verify, web-assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download verified Web assets
        uses: actions/download-artifact@v8
        with:
          name: one-web-publish-${{ github.run_id }}
          path: web-publish

      - name: Embed Web Publish archive
        shell: bash
        run: |
          ./scripts/import-web-publish.sh web-publish webui/app.zip >/dev/null

      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X oneinstack/internal/buildinfo.Version=${GITHUB_REF_NAME} \
              -X oneinstack/internal/buildinfo.BuildTime=${build_time} \
              -X oneinstack/internal/buildinfo.CommitHash=${GITHUB_SHA} \
              -X oneinstack/internal/buildinfo.WebVersion=${{ needs.web-assets.outputs.source_sha }}" \
            -o "dist/one-linux-${GOARCH}" ./cmd

      - name: Check release metadata
        if: matrix.arch == 'amd64'
        run: ./dist/one-linux-amd64 version

      - name: Create and verify package
        run: |
          ./scripts/package-release.sh "${GITHUB_REF_NAME}" packages "linux-${{ matrix.arch }}"
          ./scripts/verify-release.sh "packages/one-linux-${{ matrix.arch }}-${GITHUB_REF_NAME}.tar.gz"

      - name: Run release lifecycle smoke test
        if: matrix.arch == 'amd64'
        run: ./scripts/ci-install-smoke.sh "packages/one-linux-amd64-${GITHUB_REF_NAME}.tar.gz"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: one-linux-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            packages/one-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz
            packages/one-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz.sha256

  supply-chain:
    name: Generate SBOM and license inventory
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Scan tracked source for secrets
        run: ./scripts/secret-scan.sh

      - name: Install pinned CycloneDX generator
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "${GOBIN}"
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: Generate SBOM, module, and license files
        env:
          PATH: ${{ runner.temp }}/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          ./scripts/generate-go-sbom.sh release
          cd release
          sha256sum one-go.cdx.json one-go-licenses.tsv one-go-modules.txt > one-supply-chain.sha256

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v7
        with:
          name: one-supply-chain-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/one-go.cdx.json
            release/one-go-licenses.tsv
            release/one-go-modules.txt
            release/one-supply-chain.sha256

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: downloaded-packages
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp "downloaded-packages/one-linux-amd64-${GITHUB_REF_NAME}.tar.gz" release/oneinstack-amd64.tar.gz
          cp "downloaded-packages/one-linux-arm64-${GITHUB_REF_NAME}.tar.gz" release/oneinstack-arm64.tar.gz
          cd release
          sha256sum oneinstack-amd64.tar.gz > oneinstack-amd64.tar.gz.sha256
          sha256sum oneinstack-arm64.tar.gz > oneinstack-arm64.tar.gz.sha256
          ls -lh

      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*|*-build.*) prerelease_args+=(--prerelease) ;;
          esac

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; immutable release assets cannot be replaced" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"

      - name: Trigger server sync
        shell: bash
        env:
          WEBHOOK_URL: https://shell.oneinstack.com/api/webhook
          WEBHOOK_SECRET: ${{ secrets.ONEINSTACK_WEBHOOK_SECRET || 'oneinstack_wh_2026_9e8d7c6b5a' }}
        run: |
          payload="{\"action\":\"published\",\"release\":{\"tag_name\":\"${GITHUB_REF_NAME}\"},\"repository\":{\"full_name\":\"${GITHUB_REPOSITORY}\"}}"
          signature="sha256=$(printf '%s' "${payload}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | sed 's/^.* //')"
          curl -fsSL -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: ${signature}" \
            -d "${payload}" || echo "[WARN] Direct webhook trigger failed, release webhook will handle"

