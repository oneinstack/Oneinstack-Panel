name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run quality gate
        run: make quality

  web-assets:
    name: Resolve verified Web Publish assets
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.web.outputs.source_sha }}
    steps:
      - name: Check out Panel source
        uses: actions/checkout@v6

      - name: Check out Web Publish branch
        uses: actions/checkout@v6
        with:
          repository: oneinstack/Oneinstack-Panel-Web
          ref: Publish
          path: web-publish
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Web Publish provenance and archive
        id: web
        shell: bash
        run: |
          source_sha="$(
            ./scripts/import-web-publish.sh \
              web-publish \
              "${RUNNER_TEMP}/verified-web/app.zip"
          )"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          cp web-publish/app.zip.sha256 "${RUNNER_TEMP}/verified-web/"
          cp web-publish/build-info.json "${RUNNER_TEMP}/verified-web/"
          cp web-publish/SOURCE_SHA "${RUNNER_TEMP}/verified-web/"

      - name: Upload verified Web assets
        uses: actions/upload-artifact@v7
        with:
          name: one-web-publish-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/verified-web/

  package:
    name: Package Linux ${{ matrix.arch }}
    needs: [verify, web-assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download verified Web assets
        uses: actions/download-artifact@v8
        with:
          name: one-web-publish-${{ github.run_id }}
          path: web-publish

      - name: Embed Web Publish archive
        shell: bash
        run: |
          ./scripts/import-web-publish.sh web-publish webui/app.zip >/dev/null

      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X oneinstack/internal/buildinfo.Version=${GITHUB_REF_NAME} \
              -X oneinstack/internal/buildinfo.BuildTime=${build_time} \
              -X oneinstack/internal/buildinfo.CommitHash=${GITHUB_SHA} \
              -X oneinstack/internal/buildinfo.WebVersion=${{ needs.web-assets.outputs.source_sha }}" \
            -o "dist/one-linux-${GOARCH}" ./cmd

      - name: Check release metadata
        if: matrix.arch == 'amd64'
        run: ./dist/one-linux-amd64 version

      - name: Create and verify package
        run: |
          ./scripts/package-release.sh "${GITHUB_REF_NAME}" packages "linux-${{ matrix.arch }}"
          ./scripts/verify-release.sh "packages/one-linux-${{ matrix.arch }}-${GITHUB_REF_NAME}.tar.gz"

      - name: Run release lifecycle smoke test
        if: matrix.arch == 'amd64'
        run: ./scripts/ci-install-smoke.sh "packages/one-linux-amd64-${GITHUB_REF_NAME}.tar.gz"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: one-linux-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            packages/one-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz
            packages/one-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz.sha256

  supply-chain:
    name: Generate SBOM and license inventory
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Scan tracked source for secrets
        run: ./scripts/secret-scan.sh

      - name: Install pinned CycloneDX generator
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "${GOBIN}"
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: Generate SBOM, module, and license files
        env:
          PATH: ${{ runner.temp }}/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          ./scripts/generate-go-sbom.sh release
          cd release
          sha256sum one-go.cdx.json one-go-licenses.tsv one-go-modules.txt > one-supply-chain.sha256

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v7
        with:
          name: one-supply-chain-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/one-go.cdx.json
            release/one-go-licenses.tsv
            release/one-go-modules.txt
            release/one-supply-chain.sha256

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          cd release
          for checksum in *.sha256; do
            sha256sum -c "${checksum}"
          done
          cat ./*.sha256 > checksums.txt

      - name: Generate signed update manifest
        shell: bash
        continue-on-error: false
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_KEY_ID: ${{ secrets.UPDATE_SIGNING_KEY_ID }}
        run: |
          if [[ -z "${UPDATE_SIGNING_PRIVATE_KEY}" || -z "${UPDATE_SIGNING_KEY_ID}" ]]; then
            echo "Legacy static manifest signing is not configured; Center will sign the release."
            exit 0
          fi
          signing_key="${RUNNER_TEMP}/one-update-signing-key"
          release_channel="stable"
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*|*-build.*) release_channel="beta" ;;
          esac
          umask 077
          printf '%s' "${UPDATE_SIGNING_PRIVATE_KEY}" >"${signing_key}"
          go run ./cmd/update-manifest \
            --version "${GITHUB_REF_NAME}" \
            --channel "${release_channel}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --key-id "${UPDATE_SIGNING_KEY_ID}" \
            --private-key-file "${signing_key}" \
            --release-notes "See the signed GitHub release notes for ${GITHUB_REF_NAME}." \
            --artifact "linux-amd64=release/one-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            --artifact "linux-arm64=release/one-linux-arm64-${GITHUB_REF_NAME}.tar.gz" \
            --output release/manifest.json
          rm -f -- "${signing_key}"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*|*-build.*) prerelease_args+=(--prerelease) ;;
          esac

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --generate-notes \
              --title "OneinStack Panel ${GITHUB_REF_NAME}" \
              "${prerelease_args[@]}"
          fi

      - name: Publish release to OneinStack Center
        shell: bash
        env:
          CENTER_RELEASE_URL: ${{ secrets.CENTER_RELEASE_URL }}
          CENTER_RELEASE_TOKEN: ${{ secrets.CENTER_RELEASE_TOKEN }}
          CENTER_RELEASE_ROLLOUT_PERCENTAGE: ${{ vars.CENTER_RELEASE_ROLLOUT_PERCENTAGE }}
          CENTER_RELEASE_NOTES: See the GitHub release notes for ${{ github.ref_name }}.
        run: |
          if [[ -z "${CENTER_RELEASE_URL}" || -z "${CENTER_RELEASE_TOKEN}" ]]; then
            echo "Center publishing is not configured; GitHub Release is complete, skipping Center."
            exit 0
          fi
          release_channel="stable"
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*|*-build.*) release_channel="beta" ;;
          esac
          rollout_percentage="${CENTER_RELEASE_ROLLOUT_PERCENTAGE:-0}"
          ./scripts/publish-release-to-center.sh \
            "${CENTER_RELEASE_URL}" \
            "${GITHUB_REF_NAME}" \
            "${release_channel}" \
            "release/one-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            "release/one-linux-arm64-${GITHUB_REF_NAME}.tar.gz" \
            "${rollout_percentage}"
